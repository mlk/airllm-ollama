# The dependencies of the repository are updated by Dependabot: the Python
# packages (the manifest and the lock file) and the actions of the workflows.
# The pull requests it opens go through the same quality gates as every other
# change.
version: 2

updates:
  # The Python packages: pyproject.toml and uv.lock, in the root directory.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      # The packages of the `dev` group get a prefix of their own.
      prefix-development: "chore(deps-dev)"

  # The actions of the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request for all the actions: they are pinned in the three
    # workflows of the repository and are updated together.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
